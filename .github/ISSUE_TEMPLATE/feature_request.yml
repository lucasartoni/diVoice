name: Feature request
description: An idea to make diVoice better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        diVoice deliberately does few things, fast and well. Describing the problem you want solved, rather than a specific solution, helps us find the right one.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine diVoice could help.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dictation and cleanup
        - Scribe
        - Dictionary
        - Providers and models
        - Organizations and the server
        - Interface and settings
        - Other
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Alternatives you considered, examples from other tools, how often you'd use it.
